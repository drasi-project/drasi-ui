name: UI CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ui-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm ci --ignore-scripts --registry=https://registry.npmjs.org
      - run: npm run build
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: node --test tests/consumers/public-contract/*-check.mjs scripts/test/*.test.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: coverage
          path: coverage/
          if-no-files-found: error

  node22:
    name: Node 22 compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.20.0
          cache: npm
      - name: Exercise Node 22 bundled npm 10
        run: node -e "if (!require('node:child_process').execFileSync('npm', ['--version'], {encoding:'utf8'}).startsWith('10.')) process.exit(1)"
      - name: Exercise the documented builder from a source-only clone with no output parent
        shell: pwsh
        run: ./scripts/test-learning-builder.ps1
        env:
          DRASI_EXPECT_PLATFORM: linux
          DRASI_BUILDER_PROOF: ${{ github.workspace }}/.artifacts/learning-builder-linux-proof.json
          NPM_CONFIG_CACHE: ${{ runner.temp }}/learning-builder-linux-npm
      - run: npm ci --ignore-scripts --registry=https://registry.npmjs.org
      - run: npm run build && npm run typecheck && npm run test:coverage
      - run: npm run pack:candidates && npm run check:packages
      - run: npm run test:book-apps && npm run test:backend
      - run: node --test scripts/test/launcher-entry.test.mjs scripts/test/preview.test.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: node22-book-evidence
          include-hidden-files: true
          path: |
            .artifacts/book-apps.json
            .artifacts/consumer-proofs/developer-guide/
            .artifacts/consumer-proofs/developer-guide-next/
            .artifacts/released-backend/run-*/
            .artifacts/learning-builder-linux-proof.json
          if-no-files-found: error

  learning-builder-windows:
    name: Learning builder / Windows
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.20.0
          package-manager-cache: false
      - name: Run the actual PowerShell fresh-clone route in a path with spaces
        shell: pwsh
        run: ./scripts/test-learning-builder.ps1
        env:
          DRASI_EXPECT_PLATFORM: win32
          DRASI_BUILDER_PROOF: ${{ github.workspace }}/.artifacts/learning-builder-windows-proof.json
          NPM_CONFIG_CACHE: ${{ runner.temp }}/learning-builder-windows-npm
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: learning-builder-windows-evidence
          include-hidden-files: true
          path: .artifacts/learning-builder-windows-proof.json
          if-no-files-found: error

  backend-platforms:
    name: Backend / ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Intel
            id: darwin-x64
            runner: macos-15-intel
          - name: Linux arm64
            id: linux-arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm ci --ignore-scripts --registry=https://registry.npmjs.org
      - run: npm run build && npm run test:backend
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: backend-platform-${{ matrix.id }}
          include-hidden-files: true
          path: .artifacts/released-backend/
          if-no-files-found: error

  consumers:
    name: Packed consumers
    if: ${{ always() }}
    needs: [quality, node22, release-policy, backend-platforms, learning-builder-windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --ipc=host
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.19.0
          cache: npm
      - name: Fail the required gate if any prerequisite failed or was skipped
        env:
          PREREQUISITES: ${{ toJSON(needs) }}
        run: |
          node --input-type=module -e '
            import assert from "node:assert/strict";
            const prerequisites = JSON.parse(process.env.PREREQUISITES);
            assert.deepEqual(Object.keys(prerequisites).sort(),
              ["quality", "node22", "release-policy", "backend-platforms", "learning-builder-windows"].sort());
            for (const [name, job] of Object.entries(prerequisites)) {
              assert.equal(job.result, "success", `${name} must pass; observed ${job.result}`);
            }
          '
      - run: npm ci --ignore-scripts --registry=https://registry.npmjs.org
      - run: npm run build && npm run pack:candidates && npm run check:packages
      - run: npm run test:contracts
      - run: npm run audit:dependencies
      - run: npm run test:pnpm
      - run: npm run test:browser
        env:
          HOME: /root
      - run: npm run test:backend && npm run test:guide-live
        env:
          HOME: /root
      - name: Verify the complete live guide on non-default ports
        run: node scripts/test-live-guide.mjs --non-default-ports
        env:
          HOME: /root
      - run: node scripts/test-example-browser.mjs --live
        env:
          HOME: /root
      - run: npm run preview:prepare
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: preview-download-candidate
          path: .artifacts/preview/
          if-no-files-found: error
          retention-days: 90
      - run: node scripts/export-showcase.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: react-showcase
          path: .artifacts/showcase/
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: packed-consumer-evidence
          include-hidden-files: true
          path: |
            .artifacts/candidates/*.tgz
            .artifacts/candidates/*.json
            .artifacts/consumer-proofs/
            .artifacts/consumers.json
            .artifacts/pnpm-proof.json
            .artifacts/pnpm-lock.yaml
            .artifacts/pnpm-guide-lock.yaml
            .artifacts/browser-report.json
            .artifacts/dependency-audit/
            .artifacts/live-guide/
            .artifacts/learning-kit/learning-kit.json
            .artifacts/released-backend/run-*/
            test-results/
          if-no-files-found: error

  release-policy:
    name: Release policy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - run: node scripts/check-changesets.mjs
      - run: node --test scripts/test/*.test.mjs
      - name: Validate workflow syntax and expression contexts
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$RUNNER_TEMP/actionlint.tar.gz"
          printf '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  %s\n' "$RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check -
          mkdir "$RUNNER_TEMP/actionlint"
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP/actionlint"
          "$RUNNER_TEMP/actionlint/actionlint" -shellcheck= -pyflakes= .github/workflows/*.yml
